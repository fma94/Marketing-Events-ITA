<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing & Eventi — collegamento live</title>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;color:#141b2e;}
  h1{font-size:20px;}
  .status{font-size:13px;color:#6b7280;margin-bottom:16px;}
  button{background:#b8860b;color:#241b00;border:none;padding:10px 18px;border-radius:7px;font-weight:600;cursor:pointer;font-size:13px;}
  button:hover{background:#8a6d0f;}
  pre{background:#f4f3ef;border:1px solid #e3e1d9;border-radius:8px;padding:16px;font-size:11.5px;overflow:auto;max-height:500px;}
  .error{color:#a33333;font-size:13px;}
</style>
</head>
<body>

<h1>Marketing & Eventi — verifica collegamento live</h1>
<p class="status">Passo 1: login Microsoft. Passo 2: lettura in diretta del vero Masterplan Eventi da SharePoint (nessun dato inventato — o funziona, o dà errore).</p>

<button id="loginBtn">Accedi con Microsoft</button>
<button id="testFlowBtn" style="margin-left:8px;background:#2f6f4e;">Test scrittura checklist (Power Automate)</button>
<div id="output"></div>
<div id="flowOutput"></div>

<script>
// ============================================================
// PLACEHOLDER — sostituisci questi due valori con quelli che
// ottieni dalla registrazione app su Azure AD (vedi README.md).
// ============================================================
const CLIENT_ID = "INCOLLA_QUI_IL_CLIENT_ID";
const TENANT_ID = "INCOLLA_QUI_IL_TENANT_ID";

// File reale individuato su SharePoint in questa conversazione:
// Marketing ed Eventi ITA/Masterplan Eventi.xlsx
const DRIVE_ID = "b!ojOZBjOJV0GY2bqzbNhJML8Vsfhh1ANLrIwvEvcrQj_Njp-NkCN9T4IHQVpjQvWA";
const ITEM_ID = "01FSVKUXUACSXDRWLRGJAI4CTD5WBWQSGZ";
const SHEET_NAME = "2026";

const msalConfig = {
  auth: {
    clientId: CLIENT_ID,
    authority: `https://login.microsoftonline.com/${TENANT_ID}`,
    redirectUri: window.location.origin + window.location.pathname,
  },
  cache: { cacheLocation: "sessionStorage" },
};

const msalInstance = new msal.PublicClientApplication(msalConfig);

const graphScopes = ["Files.ReadWrite.All", "Sites.Read.All", "User.Read"];

async function ensureLogin(){
  await msalInstance.initialize();
  const redirectResult = await msalInstance.handleRedirectPromise();
  const accounts = msalInstance.getAllAccounts();
  if(accounts.length === 0){
    return null;
  }
  msalInstance.setActiveAccount(accounts[0]);
  return accounts[0];
}

async function getGraphToken(){
  const account = msalInstance.getActiveAccount();
  try{
    const result = await msalInstance.acquireTokenSilent({ scopes: graphScopes, account });
    return result.accessToken;
  }catch(e){
    const result = await msalInstance.acquireTokenPopup({ scopes: graphScopes });
    return result.accessToken;
  }
}

async function fetchMasterplan(){
  const output = document.getElementById("output");
  output.innerHTML = "<p class='status'>Recupero il token e leggo il file...</p>";
  try{
    const token = await getGraphToken();
    const url = `https://graph.microsoft.com/v1.0/drives/${DRIVE_ID}/items/${ITEM_ID}/workbook/worksheets('${SHEET_NAME}')/usedRange(valuesOnly=true)`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if(!res.ok){
      const errText = await res.text();
      output.innerHTML = `<p class="error">Errore Graph (${res.status}): ${errText}</p>`;
      return;
    }
    const data = await res.json();
    const rows = data.values || [];
    output.innerHTML = `
      <p class="status">Collegamento riuscito — ${rows.length} righe lette in diretta dal vero Masterplan Eventi.</p>
      <pre>${JSON.stringify(rows.slice(0, 15), null, 2)}</pre>
      <p class="status">(Mostrate solo le prime 15 righe per leggibilità — il collegamento funziona su tutto il foglio.)</p>
    `;
  }catch(e){
    output.innerHTML = `<p class="error">Errore: ${e.message}</p>`;
  }
}

// URL del flusso Power Automate che scrive su Checklist_Stato.xlsx.
const FLOW_URL = "https://defaultcc76ff6e826f4d0082ef35937f8efd.9d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/b94b430b609a4478b2358dc819a9b480/triggers/manual/paths/invoke?api-version=1";

async function testFlow(){
  const flowOutput = document.getElementById("flowOutput");
  flowOutput.innerHTML = "<p class='status'>Chiamo il flusso Power Automate...</p>";
  const testPayload = {
    evento: "TEST",
    eventoData: "2026-01-01",
    itemId: "test-1",
    fatto: true,
    modificatoDa: "Prova dalla webapp"
  };
  try{
    const res = await fetch(FLOW_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(testPayload)
    });
    const text = await res.text();
    flowOutput.innerHTML = `
      <p class="status">Risposta ricevuta — status HTTP: ${res.status}</p>
      <pre>${text || "(corpo vuoto, ma la richiesta è arrivata: se lo status è 200/202 ha funzionato)"}</pre>
      <p class="status">Ora vai a controllare il file Checklist_Stato.xlsx su SharePoint: dovrebbe essere comparsa una riga nuova con Evento = TEST.</p>
    `;
  }catch(e){
    flowOutput.innerHTML = `<p class="error">Errore nella chiamata: ${e.message}<br>Se nella Console del browser (F12) vedi la parola "CORS", è il problema che ti avevo anticipato — dimmelo e ti do la correzione.</p>`;
  }
}

document.getElementById("testFlowBtn").addEventListener("click", testFlow);

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  try{
    await msalInstance.loginPopup({ scopes: graphScopes });
    await fetchMasterplan();
  }catch(e){
    document.getElementById("output").innerHTML = `<p class="error">Errore login: ${e.message}</p>`;
  }
});

// Se torniamo da un redirect (o l'account è già in cache), riprova subito.
ensureLogin().then(account=>{
  if(account) fetchMasterplan();
});
</script>
</body>
</html>
