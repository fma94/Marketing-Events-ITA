<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing & Eventi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --ink:#141b2e;
    --ink-2:#2a3654;
    --paper:#f4f3ef;
    --card:#ffffff;
    --line:#e3e1d9;
    --muted:#6b7280;
    --accent:#b8860b;
    --accent-2:#8a6d0f;
    --good:#2f6f4e;
    --good-bg:#e7f2ec;
    --warn:#a15c1f;
    --warn-bg:#faeadb;
    --bad:#a33333;
    --bad-bg:#f8e6e6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .side{
    width:220px;flex-shrink:0;background:var(--ink);color:#e9e8e3;
    padding:24px 16px;display:flex;flex-direction:column;gap:28px;
  }
  .brand{font-size:15px;font-weight:700;letter-spacing:.02em;}
  .brand small{display:block;font-weight:400;color:#9aa0b4;font-size:11.5px;margin-top:2px;}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav button{
    all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:13.5px;
    color:#c7cadb;transition:background .15s,color .15s;
  }
  .nav button:hover{background:#1e2740;color:#fff;}
  .nav button.active{background:var(--accent);color:#1b1400;font-weight:600;}
  .side-foot{margin-top:auto;font-size:11px;color:#7f8497;line-height:1.5;}

  /* Main */
  .main{flex:1;padding:28px 32px 60px;max-width:1180px;}
  h1{font-size:20px;margin:0 0 4px;}
  .subtitle{color:var(--muted);font-size:13px;margin:0 0 22px;}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:28px;}
  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;}
  .kpi-value{font-size:26px;font-weight:700;line-height:1;}
  .kpi-sub{font-size:12px;color:var(--muted);margin-top:6px;}

  .section{margin-bottom:32px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-head h2{font-size:15px;margin:0;}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
  .badge.demo{background:var(--warn-bg);color:var(--warn);}
  .badge.real{background:var(--good-bg);color:var(--good);}

  /* Event cards */
  .events{display:flex;flex-direction:column;gap:10px;}
  .ev-card-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .ev-card{cursor:pointer;padding:14px 18px;display:grid;grid-template-columns:110px 1fr 130px 200px 160px;gap:16px;align-items:center;}
  .ev-card:hover{background:#faf9f6;}
  .ev-detail{display:none;padding:0 18px;border-top:1px solid var(--line);background:#faf9f6;}
  .ev-detail.open{display:block;padding:14px 18px;}
  .cl-group{break-inside:avoid;margin-bottom:10px;}
  .cl-group-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:8px 0 4px;}
  .cal-month{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;}
  .cal-month.current{border:2px solid var(--ink);background:#fdf6e8;}
  .cal-month-title{font-size:12px;font-weight:600;margin-bottom:8px;text-transform:capitalize;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-dow{font-size:9px;text-align:center;color:var(--muted);}
  .cal-day{font-size:9.5px;text-align:center;padding:3px 0;border-radius:3px;color:var(--ink-2);position:relative;cursor:default;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.has-event{color:#fff;font-weight:700;}
  .cal-day.today{outline:1.5px solid var(--ink);outline-offset:-1px;}
  .cl-item{display:flex;align-items:center;gap:14px;font-size:12.5px;padding:6px 0;cursor:pointer;}
  .cl-item input{flex-shrink:0;margin-top:0;width:14px;height:14px;}
  .cl-voce{width:340px;flex-shrink:0;line-height:1.3;}
  .cl-item.done .cl-voce{color:var(--muted);text-decoration:line-through;}
  .cl-deadline{font-size:11.5px;color:var(--muted);white-space:nowrap;flex-shrink:0;width:90px;text-align:right;padding-right:6px;}
  .cl-deadline.overdue{color:var(--bad);font-weight:600;}
  .wk-legend-current{color:var(--ink);font-weight:600;}
  .wk-legend-event{color:var(--ink-2);}
  .cl-track-empty{flex:1;}

  .wk-header-row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
  .wk-header-spacer{width:14px;flex-shrink:0;}
  .wk-header-voce{width:340px;flex-shrink:0;}
  .wk-header{flex:1;display:grid;gap:0;}
  .wk-header-deadline{width:90px;flex-shrink:0;text-align:right;padding-right:6px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;}
  .wk-cell{font-size:9.5px;text-align:center;color:var(--muted);padding:4px 0;border-radius:3px;}
  .wk-cell.wk-current{background:var(--ink);color:#fff;font-weight:700;}
  .wk-cell.wk-future{color:var(--ink-2);}
  .wk-cell.wk-event{outline:1.5px solid var(--ink);outline-offset:-1px;}

  .wk-track{flex:1;display:grid;gap:0;position:relative;height:24px;}
  .wk-baseline{grid-column:1/-1;grid-row:1;align-self:center;height:1px;background:var(--line);}
  .wk-marker{grid-row:1;align-self:stretch;justify-self:center;width:1.5px;}
  .wk-marker-today{background:var(--bad);opacity:.4;}
  .wk-marker-event{background:var(--ink);opacity:.35;}
  .wk-dot{grid-row:1;align-self:center;justify-self:center;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--accent-2);background:var(--card);z-index:2;}
  .wk-dot.done{background:var(--good);border-color:var(--good);}
  .wk-dot.urgent{background:var(--bad);border-color:var(--bad);}
  .wk-dot.soon{background:#f2c14e;border-color:#c99a1f;}
  .ev-date{font-size:12.5px;color:var(--muted);}
  .ev-name{font-weight:600;font-size:14px;}
  .ev-leader{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .status-pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:600;width:fit-content;}
  .status-pill.past{background:var(--good-bg);color:var(--good);}
  .status-pill.future{background:var(--warn-bg);color:var(--warn);}
  .status-pill.tbd{background:#ece9e2;color:var(--muted);}
  .nums{font-size:12.5px;color:var(--ink-2);}
  .nums b{color:var(--ink);}
  .progress-wrap{display:flex;flex-direction:column;gap:4px;}
  .progress-label{font-size:11px;color:var(--muted);}
  .progress-bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);}
  .progress-fill.complete{background:var(--good);}
  .proposte{font-size:12.5px;text-align:right;}
  .proposte b{color:var(--ink);}

  /* Table generic */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  th,td{text-align:left;padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--line);}
  th{background:#faf9f6;color:var(--muted);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  .btn{all:unset;cursor:pointer;background:var(--accent);color:#241b00;font-weight:600;font-size:11.5px;padding:6px 12px;border-radius:7px;}
  .btn:hover{background:var(--accent-2);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);}
  /* Dentro le card di contenuto lo sfondo cambia colore in base allo stato
     (giallo/verde): i pulsanti "ghost", essendo trasparenti, altrimenti
     prenderebbero anche loro quella tinta — li teniamo opachi. */
  .ev-card-wrap .btn.ghost{background:#fff;}

  .charts{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .chart-card h3{font-size:13px;margin:0 0 12px;}

  .view{display:none;}
  .view.active{display:block;}

  @media (max-width:900px){
    .app{flex-direction:column;}
    .side{width:100%;flex-direction:row;overflow-x:auto;align-items:center;}
    .nav{flex-direction:row;}
    .kpis{grid-template-columns:repeat(2,1fr);}
    .ev-card{grid-template-columns:1fr;text-align:left;}
    .charts{grid-template-columns:1fr;}
  }
</style>
</head>

<script>
// ============================================================
// Dropbox: login diretto dal browser (OAuth PKCE, nessun segreto
// lato server) + lettura ed estrazione degli Excel training.
// ============================================================
const READ_TRAINING_URL = "https://defaultcc76ff6e826f4d0082ef35937f8efd.9d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/00/workflows/add0687ac25d45bcb2af6ef8543f2543/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=gKCloIiu8jJiVYV2jcF0VNpCwwDGPm_HxmDFAeV_Vt0"; // Leggi Master Training Schedule
const READ_NPS_URL = "https://defaultcc76ff6e826f4d0082ef35937f8efd.9d.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/31/workflows/26414ae447144084a3fbe44bffd47065/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=tXIM7AjEKgM7IPcQadvc5hT3MRGZnPEk1HI7gFlLQN8"; // Leggi NPS Risposte

// Abbina ogni risposta NPS al training giusto: stesso nome + data più vicina (perché il
// Forms indica solo il nome, non l'edizione esatta). Aggiunge npsAvg/npsCount a ogni
// elemento di trainingResults, e restituisce la media generale su tutte le risposte.
function parseAnyDate(v){
  const s = String(v||"").trim();
  if(/^\d+(\.\d+)?$/.test(s)) return excelSerialToDate(parseFloat(s)); // seriale Excel, es. "46051.6759"
  return new Date(s);
}

// NPS vero: % Promotori (punteggio 9-10) meno % Detrattori (punteggio 0-6), non una media.
function computeNPS(scores){
  if(!scores.length) return null;
  let promotori=0, detrattori=0;
  scores.forEach(s=>{
    if(s>=9) promotori++;
    else if(s<=6) detrattori++;
  });
  return Math.round((promotori - detrattori) / scores.length * 100);
}

// Il Forms usa nomi per esteso, diversi da quelli abbreviati nelle cartelle Dropbox
// (e quindi nel Master Training Schedule) - questa tabella fa combaciare i due.
const NPS_NAME_ALIASES = {
  "flusso di produzione ad alte performance": "flusso di produzione",
  "tpm: oee, manutenzione autonoma e smed": "tpm",
  "supply chain e pianificazione": "supply chain",
  "training within industry": "twi",
};
function normName(s){
  const base = (s||"").toString().trim().toLowerCase().replace(/\s+/g," ");
  return NPS_NAME_ALIASES[base] || base;
}

function matchAndAverageNPS(trainingResults, npsRows){
  const byName = {};
  npsRows.forEach(r=>{
    const name = normName(r["Training"]);
    const nps = parseFloat(r["NPS"]);
    const dataRisposta = parseAnyDate(r["DataRisposta"]);
    if(!name || isNaN(nps) || isNaN(dataRisposta)) return;
    (byName[name] ||= []).push({dataRisposta, nps});
  });

  Object.entries(byName).forEach(([name, responses])=>{
    const sameName = trainingResults.filter(t=>normName(t.nome)===name);
    if(!sameName.length) return;
    responses.forEach(resp=>{
      let best=null, bestDiff=Infinity;
      sameName.forEach(t=>{
        if(!t.data) return;
        const diff = Math.abs(t.data - resp.dataRisposta);
        if(diff<bestDiff){ bestDiff=diff; best=t; }
      });
      if(best){
        (best._npsList ||= []).push(resp.nps);
      }
    });
  });

  trainingResults.forEach(t=>{
    if(t._npsList && t._npsList.length){
      t.npsAvg = computeNPS(t._npsList);
      t.npsCount = t._npsList.length;
    }
  });

  const allNps = npsRows.map(r=>parseFloat(r["NPS"])).filter(n=>!isNaN(n));
  return computeNPS(allNps);
}


// Raggruppa le righe per-partecipante del Master Training Schedule in una riga per
// training (stessa logica usata prima con i dati letti da Dropbox), scartando le righe
// senza una data training riconosciuta (es. cartelle senza data tipo "KLE").
function sanitizeTrainer(v){
  const s = (v==null?"":String(v)).trim();
  if(!s || /^\d+(\.\d+)?$/.test(s)) return "—"; // scarta valori numerici (date scambiate per nome)
  return s;
}

function npsCell(nps){
  if(nps==null) return "-";
  const color = nps>=85 ? "var(--good)" : (nps>=75 ? "#c99a1f" : "var(--bad)");
  const width = Math.max(0, Math.min(100, nps));
  return `
    <div style="font-size:12px;font-weight:600;margin-bottom:3px;">${nps}%</div>
    <div style="width:70px;height:5px;background:var(--line);border-radius:5px;overflow:hidden;">
      <div style="width:${width}%;height:100%;background:${color};"></div>
    </div>`;
}

function fmtEuro(n){
  const rounded = Math.round(n);
  const conPunti = Math.abs(rounded).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (rounded<0?"-":"") + "€" + conPunti;
}

function latestUpdateTimestamp(rows){
  let max = null;
  rows.forEach(r=>{
    const d = parseAnyDate(r["UltimoAggiornamento"]);
    if(!isNaN(d) && (!max || d > max)) max = d;
  });
  return max;
}

function aggregateTrainingRows(rows){
  const groups = {};
  rows.forEach(r=>{
    const dataTrainingRaw = (r["DataTraining"]||"").toString().trim();
    if(!dataTrainingRaw) return; // nessuna data -> scartata
    const key = `${r["Training"]}|${dataTrainingRaw}`;
    if(!groups[key]){
      groups[key] = {
        nome: r["Training"],
        data: parseAnyDate(dataTrainingRaw),
        trainer: sanitizeTrainer(r["Trainer"]),
        annullato: isFatto(r["Annullato"]),
        confermati: 0, nonConfermati: 0, fatturato: 0,
        aziendeSet: new Set(),
      };
    }
    const g = groups[key];
    if(!g.trainer || g.trainer === "—"){
      const t = sanitizeTrainer(r["Trainer"]);
      if(t !== "—") g.trainer = t;
    }
    const stato = (r["Stato"]||"").trim().toLowerCase();
    if(stato === "confermato") g.confermati++;
    else if(stato && stato !== "da riprogrammare") g.nonConfermati++;
    const prezzo = parseFloat(r["Prezzo"]);
    if(!isNaN(prezzo)) g.fatturato += prezzo;
    const azienda = (r["Azienda"]||"").trim();
    const aziendaLower = azienda.toLowerCase();
    if(azienda && aziendaLower!=="privato" && aziendaLower!=="kii") g.aziendeSet.add(azienda);
  });
  return Object.values(groups).map(g=>({
    ...g,
    aziende: Array.from(g.aziendeSet).join(", "),
  }));
}

function renderTrainingCalendar(results){
  const anno = today.getFullYear();
  const conData = results.filter(r=>r.data && r.data.getFullYear()===anno);
  const html = MESI_LUNGHI.map((nomeMese, m)=>{
    const primoGiorno = new Date(anno, m, 1);
    const giorniNelMese = new Date(anno, m+1, 0).getDate();
    const offset = (primoGiorno.getDay() + 6) % 7;
    const cellsPrima = Array.from({length:offset}, ()=>`<div class="cal-day empty"></div>`);
    const cellsGiorni = Array.from({length:giorniNelMese}, (_,i)=>{
      const giorno = i+1;
      const d = new Date(anno, m, giorno);
      const trainingGiorno = conData.filter(r=> r.data.getMonth()===m && r.data.getDate()===giorno);
      const isToday = d.getTime()===today.getTime();
      if(trainingGiorno.length){
        const annullato = trainingGiorno.every(r=>r.annullato);
        const colore = annullato ? "#a33333" : "#b8860b";
        const titolo = trainingGiorno.map(r=>`${r.nome}${r.annullato?' (annullato)':''}`).join(" · ");
        return `<div class="cal-day has-event${isToday?' today':''}" style="background:${colore};" title="${titolo}">${giorno}</div>`;
      }
      return `<div class="cal-day${isToday?' today':''}">${giorno}</div>`;
    });
    const dow = ["L","M","M","G","V","S","D"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
    const isMeseCorrente = m === today.getMonth();
    return `
      <div class="cal-month${isMeseCorrente?' current':''}">
        <div class="cal-month-title">${nomeMese} ${anno}</div>
        <div class="cal-grid">${dow}${cellsPrima.join("")}${cellsGiorni.join("")}</div>
      </div>`;
  }).join("");
  document.getElementById("trainingCalendarView").innerHTML = html;
}

const trainingSectionOpen = { annullati:false, svolti:false, programma:true, senzaData:true };

let lastTrainingResults = [], lastOverallNps = null;

function renderTrainingTable(results, overallNps){
  lastTrainingResults = results; lastOverallNps = overallNps;
  const sorted = [...results].sort((a,b)=>(a.data||0)-(b.data||0));
  const annullati = sorted.filter(r=>r.annullato);
  const past = sorted.filter(r=>!r.annullato && r.data && r.data<=today);
  const future = sorted.filter(r=>!r.annullato && r.data && r.data>today);
  const senzaData = sorted.filter(r=>!r.data && !r.annullato);

  const row = r => `
    <tr>
      <td>${r.nome}${r.aziende ? `<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">${r.aziende}</div>` : ""}</td>
      <td style="white-space:nowrap;">${r.data ? fmtDate(r.data) : '-'}</td>
      <td style="white-space:nowrap;">${r.trainer}</td>
      <td>${r.confermati}</td>
      <td>${r.nonConfermati}</td>
      <td>${fmtEuro(r.fatturato)}</td>
      <td>${npsCell(r.npsAvg)}</td>
    </tr>`;
  const table = (key, title, rows) => rows.length ? `
    <div class="section">
      <div class="section-head">
        <h2 style="cursor:pointer;" onclick="toggleTrainingSection('${key}')">${title} (${rows.length}) ${trainingSectionOpen[key] ? '▾' : '▸'}</h2>
      </div>
      ${trainingSectionOpen[key] ? `
      <table>
        <thead><tr><th>Training</th><th>Data</th><th>Trainer</th><th>Confermati</th><th>Da confermare</th><th>Fatturato</th><th>NPS</th></tr></thead>
        <tbody>${rows.map(row).join("")}</tbody>
      </table>` : ""}
    </div>` : "";

  document.getElementById("trainingTableWrap").innerHTML =
    table("annullati","Annullati", annullati) +
    table("svolti","Svolti", past) +
    table("programma","In programma", future) +
    table("senzaData","Senza data riconosciuta", senzaData);

  const pianificatiAdOggi = results.filter(r=>r.data && r.data<=today).length;
  const fatti = results.filter(r=>!r.annullato && r.data && r.data<=today).length;
  const fatturatoTot = results.filter(r=>!r.annullato).reduce((s,r)=>s+(r.fatturato||0),0);
  const pctFatti = pianificatiAdOggi ? Math.round(fatti/pianificatiAdOggi*100) : 0;
  const aziendeGlobali = new Set();
  results.forEach(r=>{ (r.aziende||"").split(",").map(s=>s.trim()).filter(Boolean).forEach(a=>aziendeGlobali.add(a)); });
  document.getElementById("kpi-training").innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Training</div>
      <div class="kpi-value">${fatti}/${pianificatiAdOggi}</div>
      <div class="kpi-sub">fatti / pianificati ad oggi · ${pctFatti}%</div>
    </div>
    <div class="kpi-card"><div class="kpi-label">Fatturato</div><div class="kpi-value">${fmtEuro(fatturatoTot)}</div></div>
    <div class="kpi-card"><div class="kpi-label">NPS</div><div class="kpi-value">${overallNps!=null ? overallNps+'%' : 'n/d'}</div></div>
    <div class="kpi-card"><div class="kpi-label">Aziende</div><div class="kpi-value">${aziendeGlobali.size}</div></div>
  `;

  renderTrainingCalendar(results);
}

const MESI_IT_ARR = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function pad2(n){ return String(n).padStart(2,'0'); }

function buildNewEventStrings(nomeCliente, tipoCode, dInizio, dFine){
  const tipoLabel = TIPO_CODICI[tipoCode];
  const y = dInizio.getFullYear(), m = pad2(dInizio.getMonth()+1), d = pad2(dInizio.getDate());
  let nomeCartella, dataMasterplan;
  if(dFine && dFine.getTime()!==dInizio.getTime()){
    const d2 = pad2(dFine.getDate());
    nomeCartella = `${y}_${m}_${d}-${d2}_${nomeCliente}_${tipoLabel}`;
    dataMasterplan = `${dInizio.getDate()}-${dFine.getDate()} ${MESI_IT_ARR[dInizio.getMonth()]}`;
  }else{
    nomeCartella = `${y}_${m}_${d}_${nomeCliente}_${tipoLabel}`;
    dataMasterplan = `${y}-${m}-${d}`;
  }
  return { nomeCartella, dataMasterplan, tipoLabel };
}

// (sigle BV/F/RT/KA). La vecchia mappa per nome resta solo come riserva, per eventuali righe
// senza quella colonna compilata.
const TIPO_CODICI = { "BV":"Benchmark Visit", "F":"Fiera", "RT":"Round Table", "KA":"Kaizen Award" };
const KNOWN_TYPES = {
  "BTICINO":"Benchmark Visit", "EMAK POZZILLI":"Benchmark Visit", "CUOA":"Round Table",
  "YED":"Fiera", "RANDSTAD A2A GENERALI":"Round Table", "KAIZEN AWARD":"Kaizen Award",
  "PHOENIX":"Benchmark Visit", "PARKER":"Benchmark Visit", "YOKOHAMA":"Round Table",
  "MILANO KAIZEN DAY":"Round Table", "NSG":"Benchmark Visit", "MISA":"Benchmark Visit",
  "PARADOX BERGAMO":"Benchmark Visit", "FOOD LAVAZZA":"Benchmark Visit", "FOOD BAULI":"Benchmark Visit",
};
function tipoOf(nomeEvento, codiceTipo){
  const code = (codiceTipo||"").trim().toUpperCase();
  if(TIPO_CODICI[code]) return TIPO_CODICI[code];
  return KNOWN_TYPES[(nomeEvento||"").trim().toUpperCase()] || "Benchmark Visit";
}

// ============================================================
// Date: Excel restituisce le date complete come numero seriale
// (es. 46106), i mesi approssimati restano testo libero.
// ============================================================
function excelSerialToDate(serial){
  return new Date(Math.round((serial - 25569) * 86400 * 1000));
}
const MESI_IT = {gen:0,feb:1,mar:2,apr:3,mag:4,giu:5,lug:6,ago:7,set:8,ott:9,nov:10,dic:11};
function parseEventDate(raw){
  const s = String(raw||"").trim();
  if(/^\d+$/.test(s)){
    return excelSerialToDate(parseInt(s, 10));
  }
  // Intervallo tipo "8-9 apr" o "16-18 APR": prendiamo il primo giorno.
  const m = s.match(/^(\d{1,2})\s*-\s*\d{1,2}\s+([a-zA-Z]{3,})/);
  if(m){
    const day = parseInt(m[1],10);
    const mese = MESI_IT[m[2].toLowerCase().slice(0,3)];
    if(mese!=null) return new Date(2026, mese, day);
  }
  return null; // solo mese ("ottobre") o testo libero -> data non precisa
}
function isoWeek(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNum = (firstThursday.getUTCDay() + 6) % 7;
  firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
  return 1 + Math.round((d - firstThursday) / (7*24*3600*1000));
}
function fmtDate(d){
  return d.toLocaleDateString("it-IT", {day:"2-digit", month:"short", year:"numeric"});
}
function numOrNull(v){
  if(v==null) return null;
  const s = String(v).trim();
  if(s==="" || s.toLowerCase()==="n/a") return null;
  const n = parseFloat(s.replace(",","."));
  return isNaN(n) ? null : n;
}

// ============================================================
// Stato checklist: chi ha scritto per ultimo su una voce vince
// (scriviamo sempre una riga nuova, mai un update in-place).
// ============================================================
let checklistState = {}; // chiave "Evento|EventoData|ItemId" -> true/false
function stateKey(evento, eventoDataISO, itemId){
  return `${evento}|${eventoDataISO}|${itemId}`;
}
function isFatto(v){
  if(v === true || v === 1) return true;
  const s = String(v ?? "").trim().toLowerCase();
  return s === "true" || s === "vero" || s === "1" || s === "sì" || s === "si";
}

function normalizeDateForKey(v){
  if(!v) return "";
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); // già ISO
  if(/^\d+$/.test(s)) return excelSerialToDate(parseInt(s,10)).toISOString().slice(0,10); // seriale Excel (es. "46288")
  const d = new Date(s);
  return isNaN(d) ? s : d.toISOString().slice(0,10);
}

async function fetchChecklistState(){
  const res = await fetch(READ_CHECKLIST_URL, { method:"POST" });
  const rows = await res.json();
  const state = {};
  rows.forEach(r=>{
    const key = stateKey(r["Evento"], normalizeDateForKey(r["EventoData"]), r["ItemId"]);
    state[key] = isFatto(r["Fatto"]);
  });
  return state;
}

function myName(){
  let name = localStorage.getItem("marketingEventiNome");
  if(!name){
    name = prompt("Come ti chiami? (serve solo per segnare chi ha aggiornato la checklist)") || "Anonimo";
    localStorage.setItem("marketingEventiNome", name);
  }
  return name;
}

async function toggleChecklistItem(evIdx, itemId, checked){
  const e = eventi[evIdx];
  const item = e.checklist.find(c=>c.id===itemId);
  item.done = checked; // aggiornamento ottimistico, subito visibile
  render();
  const key = stateKey(e.nome, e.dataISO || "", itemId);
  checklistState[key] = checked;
  try{
    await fetch(WRITE_CHECKLIST_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        evento: e.nome,
        eventoData: e.dataISO || "",
        itemId: itemId,
        fatto: checked,
        modificatoDa: myName()
      })
    });
  }catch(err){
    console.error("Errore salvataggio checklist:", err);
  }
}

function nuovaChecklist(tipo, doneMap, eventoNome, dataISO, isPast){
  return templates[tipo].map(t=>{
    const key = stateKey(eventoNome, dataISO || "", t.id);
    const hasExplicitState = Object.prototype.hasOwnProperty.call(doneMap, key);
    return {...t, done: hasExplicitState ? !!doneMap[key] : !!isPast};
  });
}

let eventi = [];

async function fetchEvents(){
  const res = await fetch(READ_EVENTS_URL, { method:"POST" });

async function loadAll(){
  document.getElementById("lastUpdate").textContent = "Carico i dati live...";
  try{
    const [rawEvents, doneMap] = await Promise.all([fetchEvents(), fetchChecklistState()]);
    checklistState = doneMap;

    eventi = rawEvents.map(r=>{
      const raw = r["Data"];
      const nome = r["Evento"];
      const tipo = tipoOf(nome, r["Tipo"]);
      const isExact = /^\d+$/.test(String(raw||"").trim());
      const dataObj = parseEventDate(raw);
      const dataISO = dataObj ? dataObj.toISOString().slice(0,10) : null;
      const rawTrim = raw ? String(raw).trim() : null;
      const displayRaw = rawTrim
        ? (rawTrim.charAt(0).toUpperCase() + rawTrim.slice(1)) + (/\d{4}/.test(rawTrim) ? "" : " 2026")
        : null;
      const partner = {};
      ["BFA","GGA","EGO","AVI","FCE"].forEach(k=>{
        const v = (r[k]||"").trim();
        if(v && v!=="-" && v.toUpperCase()!=="NO") partner[k]=v;
      });
      return {
        nome,
        tipo,
        data: dataISO,
        dataISO,
        isExact,
        displayRaw,
        periodoApprox: dataObj ? null : (displayRaw || "-"),
        leader: r["Leader"],
        iscritti: numOrNull(r["N° ISCRITTI"]),
        partecipanti: numOrNull(r["N° PARTECIPANTI EFFETTIVI"]),
        partner,
        proposteUscite: numOrNull(r["N_x002e_ proposte uscite"]),
        proposteAccettate: numOrNull(r["N_x002e_ proposte accettate"]),
        valore: numOrNull(r["Valore"]),
        checklist: nuovaChecklist(tipo, checklistState, nome, dataISO, dataObj && dataObj<=today),
      };
    });

    document.getElementById("lastUpdate").textContent =
      "Aggiornato al " + new Date().toLocaleString("it-IT",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    render();
  }catch(e){
    document.getElementById("lastUpdate").textContent = "Errore nel caricamento: " + e.message;
    console.error(e);
  }
}

// Scadenze e vista timeline WK (identica al prototipo validato)
// ============================================================
function scadenza(dataEventoISO, it){
  if(!dataEventoISO) return null;
  const d = new Date(dataEventoISO);
  if(it.settimane!=null){ d.setDate(d.getDate() - it.settimane*7); return d; }
  if(it.giorniDopo!=null){ d.setDate(d.getDate() + it.giorniDopo); return d; }
  return null;
}
function deadlineLabel(it, dataEventoISO){
  const sc = scadenza(dataEventoISO, it);
  if(!sc) return "-";
  return `WK${isoWeek(sc)}`;
}
function dueWeekOf(it, dataEventoISO){
  const sc = scadenza(dataEventoISO, it);
  return sc ? isoWeek(sc) : null;
}

function renderPlainGroup(g, items, idx){
  return `
    <div class="cl-group">
      <div class="cl-group-title">${g}</div>
      ${items.map(it=>`
        <label class="cl-item ${it.done?'done':''}">
          <input type="checkbox" data-ev="${idx}" data-item="${it.id}" ${it.done?'checked':''}>
          <span class="cl-voce">${it.voce}</span>
          <span class="cl-track-empty"></span>
          <span class="cl-deadline">-</span>
        </label>`).join("")}
    </div>`;
}

function renderChecklist(e, idx, gruppi){
  const preItems = e.checklist.filter(c=>c.settimane!=null);
  const postItems = e.checklist.filter(c=>c.giorniDopo!=null);
  const hasTrack = !!e.data && (preItems.length || postItems.length);
  if(!hasTrack) return Object.entries(gruppi).map(([g,items])=>renderPlainGroup(g,items,idx)).join("");

  const eventWeek = isoWeek(new Date(e.data));
  const maxWeeksBefore = Math.max(8, preItems.length ? Math.max(...preItems.map(c=>c.settimane)) : 0);
  const maxDaysAfter = postItems.length ? Math.max(...postItems.map(c=>c.giorniDopo)) : 0;
  const weeksAfter = Math.ceil(maxDaysAfter/7);
  const currentWeek = isoWeek(today);
  const weekStart = Math.min(eventWeek - maxWeeksBefore, currentWeek);
  const weekEnd = Math.max(eventWeek + weeksAfter, currentWeek);
  const cols = []; for(let w=weekStart; w<=weekEnd; w++) cols.push(w);
  const gridStyle = `grid-template-columns:repeat(${cols.length},1fr);`;

  const header = `<div class="wk-header-row">
    <span class="wk-header-spacer"></span>
    <span class="wk-header-voce"></span>
    <div class="wk-header" style="${gridStyle}">${cols.map((w,i)=>{
      const cls = w===currentWeek?'wk-current':(w<currentWeek?'wk-past':'wk-future');
      return `<div class="wk-cell ${cls}${w===eventWeek?' wk-event':''}" style="grid-column:${i+1};" title="WK${w}">${w}</div>`;
    }).join("")}</div>
    <span class="wk-header-deadline">Deadline</span>
  </div>`;

  const groupsHtml = Object.entries(gruppi).map(([g,items])=>`
    <div class="cl-group">
      <div class="cl-group-title">${g}</div>
      ${items.map(it=>{
        const dueWeek = dueWeekOf(it, e.data);
        const itemHasTrack = dueWeek!=null;
        const overdue = itemHasTrack && !it.done && dueWeek < currentWeek;
        let dotStatus = "normal";
        if(it.done) dotStatus = "done";
        else if(itemHasTrack && dueWeek <= currentWeek) dotStatus = "urgent";
        else if(itemHasTrack && dueWeek === currentWeek+1) dotStatus = "soon";
        const colIndex = itemHasTrack ? (dueWeek - weekStart) : null;
        const todayInWindow = currentWeek >= weekStart && currentWeek <= weekEnd;
        const ticks = `<div class="wk-baseline"></div>
          <div class="wk-marker wk-marker-event" style="grid-column:${eventWeek-weekStart+1};" title="Giorno evento"></div>
          ${todayInWindow ? `<div class="wk-marker wk-marker-today" style="grid-column:${currentWeek-weekStart+1};" title="Oggi"></div>` : ""}`;
        const dot = itemHasTrack ? `<div class="wk-dot ${dotStatus}" style="grid-column:${colIndex+1};" title="WK${dueWeek}"></div>` : "";
        return `
        <label class="cl-item ${it.done?'done':''}">
          <input type="checkbox" data-ev="${idx}" data-item="${it.id}" ${it.done?'checked':''}>
          <span class="cl-voce">${it.voce}</span>
          ${itemHasTrack ? `<div class="wk-track" style="${gridStyle}">${ticks}${dot}</div>` : `<span class="cl-track-empty"></span>`}
          <span class="cl-deadline ${overdue?'overdue':''}">${overdue?'in ritardo · ':''}${deadlineLabel(it, e.data)}</span>
        </label>`;
      }).join("")}
    </div>`).join("");

  return `<div style="grid-column:1/-1;">${header}${groupsHtml}</div>`;
}

const MESI_LUNGHI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function renderCalendar(){
  const anno = today.getFullYear();
  const conDataEsatta = eventi.filter(e=>e.data);
  const html = MESI_LUNGHI.map((nomeMese, m)=>{
    const primoGiorno = new Date(anno, m, 1);
    const giorniNelMese = new Date(anno, m+1, 0).getDate();
    const offset = (primoGiorno.getDay() + 6) % 7; // lunedì=0
    const cellsPrima = Array.from({length:offset}, ()=>`<div class="cal-day empty"></div>`);
    const cellsGiorni = Array.from({length:giorniNelMese}, (_,i)=>{
      const giorno = i+1;
      const d = new Date(anno, m, giorno);
      const eventiGiorno = conDataEsatta.filter(e=>{
        const ed = new Date(e.data);
        return ed.getFullYear()===anno && ed.getMonth()===m && ed.getDate()===giorno;
      });
      const isToday = d.getTime()===today.getTime();
      if(eventiGiorno.length){
        const c = TYPE_COLORS[eventiGiorno[0].tipo] || {fg:"#6b7280"};
        const titolo = eventiGiorno.map(e=>`${e.nome} (${e.tipo})`).join(" · ");
        return `<div class="cal-day has-event${isToday?' today':''}" style="background:${c.fg};" title="${titolo}">${giorno}</div>`;
      }
      return `<div class="cal-day${isToday?' today':''}">${giorno}</div>`;
    });
    const dow = ["L","M","M","G","V","S","D"].map(d=>`<div class="cal-dow">${d}</div>`).join("");
    const isMeseCorrente = m === today.getMonth();
    return `
      <div class="cal-month${isMeseCorrente?' current':''}">
        <div class="cal-month-title">${nomeMese} ${anno}</div>
        <div class="cal-grid">${dow}${cellsPrima.join("")}${cellsGiorni.join("")}</div>
      </div>`;
  }).join("");
  document.getElementById("calendarView").innerHTML = html;
}

const eventSectionOpen = { svolti:false, programma:true, daProgrammare:true };

function render(){
  const withIdx = eventi.map((e,i)=>[e,i]);
  const pastWithIdx = withIdx.filter(([e])=>e.data && new Date(e.data)<=today)
    .sort((a,b)=> new Date(a[0].data) - new Date(b[0].data));
  const futureWithIdx = withIdx.filter(([e])=>e.data && new Date(e.data)>today)
    .sort((a,b)=> new Date(a[0].data) - new Date(b[0].data));
  const tbdWithIdx = withIdx.filter(([e])=>!e.data);

  const eventSection = (key, title, list) => list.length ? `
    <div class="section">
      <div class="section-head">
        <h2 style="cursor:pointer;" onclick="toggleEventSection('${key}')">${title} (${list.length}) ${eventSectionOpen[key] ? '▾' : '▸'}</h2>
      </div>
      ${eventSectionOpen[key] ? `<div class="events">${list.map(([e,i])=>renderEventCard(e,i)).join("")}</div>` : ""}
    </div>` : "";

  document.getElementById("eventiListWrap").innerHTML =
    eventSection("svolti","Svolti", pastWithIdx) +
    eventSection("programma","In programma", futureWithIdx) +
    eventSection("daProgrammare","Da programmare", tbdWithIdx);

  const totIscritti = eventi.reduce((s,e)=>s+(e.iscritti||0),0);
  const totPartecipanti = eventi.reduce((s,e)=>s+(e.partecipanti||0),0);
  const conProposte = eventi.filter(e=>e.proposteUscite!=null);
  const totProposteUscite = conProposte.length ? conProposte.reduce((s,e)=>s+e.proposteUscite,0) : null;
  const totProposteAccettate = conProposte.length ? conProposte.reduce((s,e)=>s+e.proposteAccettate,0) : null;
  const totValore = conProposte.length ? conProposte.reduce((s,e)=>s+e.valore,0) : null;



  const pctPartecipazione = totIscritti ? Math.round(totPartecipanti/totIscritti*100) : 0;
  const pctProposte = totProposteUscite ? Math.round(totProposteAccettate/totProposteUscite*100) : 0;

  document.getElementById("kpi-eventi").innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">Eventi svolti</div>
      <div class="kpi-value">${pastWithIdx.length}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Partecipazione</div>
      <div class="kpi-value">${totPartecipanti}/${totIscritti}</div>
      <div class="kpi-sub">partecipanti / iscritti · ${pctPartecipazione}%</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Proposte</div>
      <div class="kpi-value">${totProposteAccettate ?? '–'}/${totProposteUscite ?? '–'}</div>
      <div class="kpi-sub">accettate / uscite · ${totProposteUscite ? pctProposte+'%' : 'n/d'}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">Valore proposte accettate</div>
      <div class="kpi-value">${totValore!=null ? fmtEuro(totValore) : 'n/d'}</div>
    </div>
  `;

  renderCalendar();
}

// (post/articoli/newsletter) collegati a eventi o training.
// Persistenza: se READ_CONTENT_URL/WRITE_CONTENT_URL sono vuoti, i
// contenuti restano in localStorage (solo su questo browser); appena

const CONTENT_STORAGE_KEY = "contentFactoryItems";
const CONTENT_STATI = ["Da scrivere","Bozza","In revisione","Pronto","Pubblicato"];
let contentItems = [];

function generateContentId(){
  return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function loadContentFromLocal(){
  try{
    const raw = localStorage.getItem(CONTENT_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveContentToLocal(){
  try{ localStorage.setItem(CONTENT_STORAGE_KEY, JSON.stringify(contentItems)); }catch(e){}
}
async function saveContentRemote(item){
  if(!WRITE_CONTENT_URL) return;
  try{
    await fetch(WRITE_CONTENT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    });
  }catch(e){
    console.error("Errore salvataggio contenuto sul Content Plan:", e);
  }
}

// "Elenca righe presenti in una tabella" restituisce le righe con le
// chiavi identiche alle intestazioni della tabella Excel (PascalCase:
// ID, CollegamentoTipo, Stato...), non i nomi camelCase usati nel resto
// del codice — qui li traduciamo, con fallback ai nomi camelCase per
// restare compatibili anche con le righe già salvate in localStorage.
function normalizeContentRow(r){
  return {
    id: r["ID"] ?? r.id,
    collegamentoTipo: r["CollegamentoTipo"] ?? r.collegamentoTipo,
    collegamentoNome: r["CollegamentoNome"] ?? r.collegamentoNome,
    collegamentoData: r["CollegamentoData"] ?? r.collegamentoData,
    tipoContenuto: r["TipoContenuto"] ?? r.tipoContenuto,
    stato: r["Stato"] ?? r.stato,
    titolo: r["Titolo"] ?? r.titolo ?? "",
    testo: r["Testo"] ?? r.testo ?? "",
    dataPianificata: r["DataPianificata"] ?? r.dataPianificata ?? "",
    dataPubblicazione: r["DataPubblicazione"] ?? r.dataPubblicazione ?? "",
    linkPubblicato: r["LinkPubblicato"] ?? r.linkPubblicato ?? "",
    responsabile: r["Responsabile"] ?? r.responsabile ?? "",
    updatedAt: r["UltimoAggiornamento"] ?? r.updatedAt ?? "",
  };
}

async function loadContentItems(){
  if(READ_CONTENT_URL){
    try{
      const res = await fetch(READ_CONTENT_URL, { method:"POST" });
      const rows = await res.json();
      contentItems = rows.map(normalizeContentRow).filter(c=>c.id);
    }catch(e){
      console.error("Errore caricamento Content Plan, uso la copia locale:", e);
      contentItems = loadContentFromLocal();
    }
  }else{
    contentItems = loadContentFromLocal();
  }
  renderContentFactory();
}

// Etichetta leggibile "Nome · data" per un collegamento evento/training.
function collegamentoLabel(tipo, nome, dataRaw){
  let dataLabel = "data da definire";
  if(dataRaw){
    const d = new Date(dataRaw);
    if(!isNaN(d)) dataLabel = fmtDate(d);
  }
  return `${nome} · ${dataLabel}`;
}

// Fonte delle opzioni per il menu "Quale evento/training": riusa gli
// array già caricati da Eventi/Training, nessuna nuova fonte dati.
function collegamentoOptions(tipo){
  if(tipo === "training"){
    // In ordine cronologico (prima i più vicini/passati, poi i futuri via via
    // più lontani); quelli senza data valida vanno in fondo all'elenco.
    const ordinati = [...lastTrainingResults].sort((a,b)=>{
      if(!a.data && !b.data) return 0;
      if(!a.data) return 1;
      if(!b.data) return -1;
      return a.data - b.data;
    });
    return ordinati.map(t=>({ nome:t.nome, data: t.data ? t.data.toISOString().slice(0,10) : "" }));
  }
  return eventi.map(e=>({ nome:e.nome, data: e.data || "" }));
}

// Unico punto di scelta evento/training per l'intero pannello "Nuovo
// contenuto": popola il menu "Quale" e, insieme, carica il materiale
// grezzo già salvato per quell'evento/training (se c'è).
function refreshContentRiferimentoOptions(){
  const tipo = document.getElementById("newContentTipoCollegamento").value;
  const sel = document.getElementById("newContentRiferimento");
  const opts = collegamentoOptions(tipo);
  sel.innerHTML = opts.length
    ? opts.map((o,i)=>`<option value="${i}">${collegamentoLabel(tipo, o.nome, o.data)}</option>`).join("")
    : `<option value="">Nessun ${tipo==="training"?"training":"evento"} disponibile</option>`;
  sel._opts = opts;
}
document.getElementById("newContentTipoCollegamento").addEventListener("change", refreshContentRiferimentoOptions);

// Elenco (solo locale, non su SharePoint) dei gruppi evento/training +
// tipo contenuto creati da "+ Nuovo contenuto" ma senza ancora nessuna
// bozza dentro. Serve solo a far comparire la riga/sezione subito dopo
// "Crea contenuto", senza dover generare una bozza vuota finta per
// farla apparire — appena la prima bozza viene generata, il gruppo
// risulta comunque (anche) da contentItems, quindi build ContentGroups
// unisce le due fonti senza duplicati.
const EMPTY_GROUPS_STORAGE_KEY = "contentEmptyGroups";
let emptyGroups = [];

function groupKeyOf(collegamentoTipo, collegamentoNome, collegamentoData, tipoContenuto){
  return `${collegamentoTipo}|${collegamentoNome}|${collegamentoData}|${tipoContenuto}`;
}

function loadEmptyGroups(){
  try{
    const raw = localStorage.getItem(EMPTY_GROUPS_STORAGE_KEY);
    emptyGroups = raw ? JSON.parse(raw) : [];
  }catch(e){ emptyGroups = []; }
}
function saveEmptyGroups(){
  try{ localStorage.setItem(EMPTY_GROUPS_STORAGE_KEY, JSON.stringify(emptyGroups)); }catch(e){}
}

function submitAddContent(){
  const tipoCollegamento = document.getElementById("newContentTipoCollegamento").value;
  const selRif = document.getElementById("newContentRiferimento");
  const opts = selRif._opts || [];
  const scelto = opts[selRif.value];
  const tipoContenuto = document.getElementById("newContentTipo").value;
  const statusEl = document.getElementById("addContentStatus");

  if(!scelto){
    statusEl.innerHTML = `<span class="error">Collega il contenuto a un evento o training prima di crearlo.</span>`;
    return;
  }

  // Non crea nessuna bozza: solo il "gruppo" evento/tipo contenuto, così
  // sotto compare la sezione con materiale grezzo e generazione bozze.
  const key = groupKeyOf(tipoCollegamento, scelto.nome, scelto.data, tipoContenuto);
  if(!emptyGroups.some(g=>groupKeyOf(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData, g.tipoContenuto)===key)){
    emptyGroups.push({ collegamentoTipo: tipoCollegamento, collegamentoNome: scelto.nome, collegamentoData: scelto.data, tipoContenuto });
    saveEmptyGroups();
  }
  statusEl.innerHTML = `<span style="color:var(--good);">Contenuto creato.</span>`;
  document.getElementById("addContentForm").style.display = "none";
  renderContentFactory();
}
document.getElementById("showAddContentBtn").addEventListener("click", ()=>{
  refreshContentRiferimentoOptions();
  document.getElementById("addContentForm").style.display = "block";
});
document.getElementById("cancelAddContentBtn").addEventListener("click", ()=>{
  document.getElementById("addContentForm").style.display = "none";
});
document.getElementById("submitAddContentBtn").addEventListener("click", submitAddContent);

function updateContentItem(id, changes){
  const item = contentItems.find(c=>c.id===id);
  if(!item) return;
  Object.assign(item, changes, { updatedAt: new Date().toISOString() });
  if(changes.stato === "Pubblicato" && !item.dataPubblicazione){
    item.dataPubblicazione = new Date().toISOString().slice(0,10);
  }
  saveContentToLocal();
  saveContentRemote(item);
}
function onContentStatoChange(id, nuovoStato){
  updateContentItem(id, { stato: nuovoStato });
  renderContentFactory();
}
function onContentTestoChange(id, testo){
  updateContentItem(id, { testo });
}
function onContentTitoloChange(id, titolo){
  updateContentItem(id, { titolo });
}
function onContentDataPianificataChange(id, dataPianificata){
  updateContentItem(id, { dataPianificata });
  renderContentFactory();
}
function onContentLinkChange(id, link){
  updateContentItem(id, { linkPubblicato: link });
}
function deleteContentItem(id){
  if(!confirm("Eliminare questo contenuto? L'azione non è reversibile.")) return;
  contentItems = contentItems.filter(c=>c.id!==id);
  saveContentToLocal();
  renderContentFactory();
}

// Prompt pronto da incollare in Claude (o altro strumento AI) finché
// GENERATE_CONTENT_URL non è collegato a un flusso AI vero e proprio.
// Se per l'evento/training collegato esiste del materiale grezzo salvato
// (appunti, note, interviste), lo include così il testo generato lo usa
// davvero come base invece di restare generico.
function buildContentPrompt(item){
  const materiale = getMaterialeTesto(item.collegamentoTipo, item.collegamentoNome, item.collegamentoData);
  return `Scrivi un ${item.tipoContenuto.toLowerCase()} in italiano, tono professionale ma diretto, per Kaizen Institute Italy.\n`
    + `Collegato a (${item.collegamentoTipo}): ${item.collegamentoNome}\n`
    + `Data: ${item.collegamentoData || item.dataPianificata || "da definire"}\n`
    + (materiale ? `Materiale di partenza (appunti, note, interviste):\n${materiale}\n` : "")
    + `Obiettivo: ${materiale ? "usa davvero i contenuti del materiale sopra (fatti, dettagli, citazioni se presenti)" : "raccontare/promuovere questo " + (item.collegamentoTipo==="training"?"training":"evento")} in modo coerente con lo stile Kaizen Institute (miglioramento continuo, concretezza, risultati misurabili). Lunghezza: 80-120 parole.\n`
    + `Rispondi in questo formato esatto, su due righe:\nTITOLO: <qui il titolo, breve e specifico>\nTESTO: <qui il testo del contenuto>`;
}

// btn è opzionale: se passato (click diretto sulla card), viene mostrato
// uno stato di caricamento così è chiaro che l'azione è partita — un
// aggiornamento AI può richiedere qualche secondo e altrimenti sembra
// che il click non abbia fatto nulla.
async function generateDraft(id, btn){
  const item = contentItems.find(c=>c.id===id);
  if(!item) return;
  if(!GENERATE_CONTENT_URL){
    const prompt = buildContentPrompt(item);
    try{
      await navigator.clipboard.writeText(prompt);
      alert("Il flusso AI non è ancora collegato: ho copiato un prompt pronto negli appunti. Incollalo in Claude (o altro strumento AI), poi incolla qui il testo che ottieni.");
    }catch(e){
      alert("Il flusso AI non è ancora collegato. Prompt suggerito da incollare in Claude o altro strumento AI:\n\n" + prompt);
    }
    return;
  }
  const originalLabel = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = "Aggiornamento..."; }
  const materiale = getMaterialeTesto(item.collegamentoTipo, item.collegamentoNome, item.collegamentoData);
  try{
    const res = await fetch(GENERATE_CONTENT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tipoContenuto: item.tipoContenuto,
        collegamentoTipo: item.collegamentoTipo,
        collegamentoNome: item.collegamentoNome,
        collegamentoData: item.collegamentoData,
        materialeGrezzo: materiale,
        angolo: "scegli tu l'angolo più adatto",
      })
    });
    const data = await res.json();
    if(data && data.testo){
      updateContentItem(id, { titolo: data.titolo || item.titolo, testo: data.testo, stato: item.stato==="Da scrivere" ? "Bozza" : item.stato });
      renderContentFactory();
      return; // il re-render sostituisce già il pulsante, niente da ripristinare
    }
  }catch(e){
    alert("Errore nella generazione della bozza: " + e.message);
  }
  if(btn && document.body.contains(btn)){ btn.disabled = false; btn.textContent = originalLabel; }
}

// Sfondo diverso per rendere subito visibile lo stato di avanzamento a
// colpo d'occhio: giallo leggero per "In revisione", verdino per
// "Pubblicato", normale per tutti gli altri stati.
function contentCardBackground(stato){
  if(stato === "In revisione") return "#fdf6e3";
  if(stato === "Pubblicato") return "#e8f5e9";
  return "var(--card)";
}

// Colore "pieno" della pillola quando quello stato è quello attuale —
// stessi colori dello sfondo della card, ma pieni invece che leggeri,
// per coerenza visiva. Gli altri stati restano neutri (var(--accent)).
function statoPillColor(stato){
  if(stato === "In revisione") return "#f2c94c";
  if(stato === "Pubblicato") return "#66bb6a";
  return "var(--accent)";
}

// Solo due pulsanti manuali: "Da scrivere"/"Bozza"/"Pronto" restano stati
// interni (impostati in automatico alla creazione o dalla generazione
// AI), qui si sceglie a mano solo se il contenuto è in revisione o è
// stato pubblicato. Quello attuale è pieno/colorato, l'altro contornato.
const CONTENT_STATI_PILLS = ["In revisione", "Pubblicato"];
function renderStatoPills(item){
  return CONTENT_STATI_PILLS.map(s=>{
    const active = s === item.stato;
    const bg = active ? statoPillColor(s) : "transparent";
    const border = active ? "transparent" : "var(--line)";
    const color = active ? "#241b00" : "var(--ink-2)";
    const weight = active ? "700" : "400";
    return `<button type="button" onclick="onContentStatoChange('${item.id}', '${s}')" style="font-family:inherit;font-size:10.5px;font-weight:${weight};padding:4px 9px;border-radius:20px;border:1px solid ${border};background:${bg};color:${color};cursor:pointer;white-space:nowrap;">${s}</button>`;
  }).join("");
}

function renderContentCard(item){
  return `
  <div class="ev-card-wrap" style="background:${contentCardBackground(item.stato)};">
    <div style="padding:14px 18px;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);">
          Pianificato:
          <input type="date" value="${item.dataPianificata||""}" onchange="onContentDataPianificataChange('${item.id}', this.value)" style="font-size:11.5px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;">
        </div>
        <button class="btn ghost" style="font-size:10.5px;padding:4px 9px;" onclick="deleteContentItem('${item.id}')">Elimina</button>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;">
        ${renderStatoPills(item)}
      </div>
      <div style="margin-top:10px;">
        <input type="text" value="${item.titolo||""}" placeholder="Titolo..." onchange="onContentTitoloChange('${item.id}', this.value)" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;font-weight:600;margin-bottom:6px;">
        <textarea onchange="onContentTestoChange('${item.id}', this.value)" placeholder="Testo del contenuto..." style="width:100%;min-height:90px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;resize:vertical;">${item.testo||""}</textarea>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px;flex-wrap:wrap;">
        ${item.stato==="Pubblicato"
          ? `<input type="text" value="${item.linkPubblicato||""}" placeholder="Link al post pubblicato" onchange="onContentLinkChange('${item.id}', this.value)" style="flex:1;min-width:200px;font-size:11.5px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;">`
          : `<button class="btn ghost" style="font-size:11px;padding:5px 10px;" onclick="generateDraft('${item.id}', this)" title="Rigenera questa bozza con l'AI usando il materiale grezzo attuale del gruppo">Aggiorna bozza</button><span></span>`}
      </div>
    </div>
  </div>`;
}

// Raggruppa i contenuti per evento/training + tipo contenuto (nell'ordine
// in cui sono stati creati) invece che per stato: ogni gruppo mostra il
// suo materiale grezzo e il generatore di bozze, con le bozze di quel
// gruppo in coda subito sotto.
function buildContentGroups(){
  const map = new Map();
  const order = [];
  // Prima i gruppi creati ma ancora senza bozze (da "+ Nuovo contenuto"),
  // così compaiono subito anche prima di generare qualunque cosa.
  emptyGroups.forEach(g=>{
    const key = groupKeyOf(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData, g.tipoContenuto);
    if(!map.has(key)){
      map.set(key, { collegamentoTipo: g.collegamentoTipo, collegamentoNome: g.collegamentoNome, collegamentoData: g.collegamentoData, tipoContenuto: g.tipoContenuto, items: [] });
      order.push(key);
    }
  });
  contentItems.forEach(item=>{
    const key = groupKeyOf(item.collegamentoTipo, item.collegamentoNome, item.collegamentoData, item.tipoContenuto);
    if(!map.has(key)){
      map.set(key, {
        collegamentoTipo: item.collegamentoTipo,
        collegamentoNome: item.collegamentoNome,
        collegamentoData: item.collegamentoData,
        tipoContenuto: item.tipoContenuto,
        items: [],
      });
      order.push(key);
    }
    map.get(key).items.push(item);
  });
  return order.map(k=>map.get(k));
}

let contentGroupsMeta = [];

// Per il gruppo (chiave = evento/training + tipo contenuto): true/assente
// = aperto, false = chiuso. Cliccando sul nome dell'evento nel titolo si
// chiude/apre la sezione (materiale grezzo + bozze), tenendo solo
// l'intestazione visibile.
let contentGroupOpen = {};
function isContentGroupOpen(key){
  return contentGroupOpen[key] !== false;
}
function toggleContentGroup(key){
  contentGroupOpen[key] = !isContentGroupOpen(key);
  renderContentFactory();
}

// Info specifica dell'evento/training da mostrare nel titolo del gruppo:
// per gli eventi il tipo puntuale (Benchmark Visit, Round Table, Fiera,
// Kaizen Award...) preso dall'elenco eventi già caricato, non la macro
// categoria "evento"; per i training semplicemente "Training". Più la
// data, se disponibile.
function collegamentoInfoLabel(collegamentoTipo, nome, data){
  let dataLabel = "data da definire";
  if(data){
    const d = new Date(data);
    if(!isNaN(d)) dataLabel = fmtDate(d);
  }
  if(collegamentoTipo === "training"){
    return `Training · ${dataLabel}`;
  }
  const match = eventi.find(e => e.nome === nome && (e.data||"") === (data||""));
  const tipoSpecifico = match ? match.tipo : "Evento";
  return `${tipoSpecifico} · ${dataLabel}`;
}

function deleteContentGroup(idx){
  const g = contentGroupsMeta[idx];
  if(!g) return;
  const n = g.items.length;
  const msg = n
    ? `Eliminare "${g.collegamentoNome}" (${g.tipoContenuto}) con tutte le sue ${n} bozz${n===1?"a":"e"}? L'azione non è reversibile.`
    : `Eliminare "${g.collegamentoNome}" (${g.tipoContenuto})?`;
  if(!confirm(msg)) return;
  const key = groupKeyOf(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData, g.tipoContenuto);
  contentItems = contentItems.filter(c => groupKeyOf(c.collegamentoTipo, c.collegamentoNome, c.collegamentoData, c.tipoContenuto) !== key);
  saveContentToLocal();
  emptyGroups = emptyGroups.filter(eg => groupKeyOf(eg.collegamentoTipo, eg.collegamentoNome, eg.collegamentoData, eg.tipoContenuto) !== key);
  saveEmptyGroups();
  renderContentFactory();
}

// Rigenera TUTTE le bozze esistenti del gruppo, una dopo l'altra, con il
// materiale grezzo corrente — comodo dopo aver modificato il materiale
// senza dover cliccare "Aggiorna bozza" su ogni singola card.
async function aggiornaBozzeGroup(idx){
  const g = contentGroupsMeta[idx];
  if(!g) return;
  if(!GENERATE_CONTENT_URL){
    const statusEl = document.getElementById(`generaBozzeStatus-${idx}`);
    if(statusEl) statusEl.innerHTML = `<span class="error">Il flusso AI non è ancora collegato.</span>`;
    return;
  }
  // Le bozze già pubblicate non vanno toccate: sono già uscite, non ha
  // senso riscriverle sotto ai piedi di chi le ha pubblicate.
  const ids = g.items.filter(it=>it.stato!=="Pubblicato").map(it=>it.id);
  const statusElInit = document.getElementById(`generaBozzeStatus-${idx}`);
  if(!ids.length){
    if(statusElInit) statusElInit.innerHTML = `<span style="color:var(--muted);">Nessuna bozza da aggiornare (sono tutte pubblicate).</span>`;
    return;
  }
  salvaMaterialeGroup(idx);
  for(let i=0; i<ids.length; i++){
    const statusEl = document.getElementById(`generaBozzeStatus-${idx}`);
    if(statusEl) statusEl.textContent = `Aggiorno bozza ${i+1} di ${ids.length}...`;
    await generateDraft(ids[i]);
  }
  const finalStatusEl = document.getElementById(`generaBozzeStatus-${idx}`);
  const skipped = g.items.length - ids.length;
  const suffix = skipped === 1 ? "a" : "e";
  finalStatusEl && (finalStatusEl.innerHTML = `<span style="color:var(--good);">${ids.length} bozz${ids.length===1?"a aggiornata":"e aggiornate"}${skipped ? ` (${skipped} già pubblicat${suffix}, lasciat${suffix} invariat${suffix})` : ""}.</span>`);
}

function renderContentGroup(g, idx){
  const materiale = getMaterialeTesto(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData);
  const key = groupKeyOf(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData, g.tipoContenuto);
  const open = isContentGroupOpen(key);
  return `
  <div class="section">
    <div class="section-head" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <h2 style="font-size:14px;margin:0;cursor:pointer;" onclick="toggleContentGroup('${key}')">
        ${open ? '▾' : '▸'} ${g.collegamentoNome}
        <span style="font-weight:400;color:var(--muted);font-size:12px;">— ${collegamentoInfoLabel(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData)} · ${g.tipoContenuto} · ${g.items.length} bozz${g.items.length===1?"a":"e"}</span>
      </h2>
      <button class="btn ghost" style="font-size:10.5px;padding:4px 9px;flex-shrink:0;" onclick="deleteContentGroup(${idx})">Elimina evento</button>
    </div>
    ${open ? `
    <div style="background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin:8px 0 12px;">
      <label style="font-size:12px;">Materiale grezzo (appunti, note, interviste) — si salva da solo mentre scrivi, modificalo quando vuoi<br>
        <textarea id="materiale-${idx}" oninput="scheduleAutosaveMateriale(${idx})" onchange="salvaMaterialeGroup(${idx})" placeholder="Incolla qui appunti, trascrizioni di interviste, punti salienti dell'evento/training..." style="width:100%;min-height:80px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:12.5px;resize:vertical;margin-top:3px;">${materiale}</textarea>
      </label>
      <div style="margin-top:4px;">
        <span id="materialeStatus-${idx}" style="font-size:11.5px;color:var(--muted);"></span>
      </div>
      <div style="display:flex;gap:10px;align-items:flex-end;margin-top:10px;flex-wrap:wrap;">
        <label style="font-size:12px;">Quante bozze generare<br>
          <input id="numBozze-${idx}" type="number" min="0" max="20" value="0" style="width:70px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;margin-top:3px;">
        </label>
        <button class="btn" onclick="generaBozzeGroup(${idx})">Genera bozze AI</button>
        <button class="btn ghost" onclick="aggiornaBozzeGroup(${idx})" title="Rigenera tutte le bozze già esistenti di questo evento con il materiale grezzo attuale">Aggiorna bozze</button>
      </div>
      <div id="generaBozzeStatus-${idx}" style="font-size:12px;margin-top:4px;"></div>
    </div>
    <div class="events">
      ${g.items.map(renderContentCard).join("")}
    </div>` : ""}
  </div>`;
}

// Titolo + lista dei gruppi (con il loro idx originale, che identifica gli
// elementi id="materiale-N"/"numBozze-N"/ecc. — va tenuto quello di
// buildContentGroups, non un indice ricalcolato dopo il filtro) di una
// delle due macro-sezioni Eventi/Training.
function renderContentBucket(titolo, entries){
  if(!entries.length) return "";
  return `
    <h2 style="font-size:15px;margin:20px 0 8px;color:var(--ink-2);">${titolo}</h2>
    ${entries.map(({g, idx})=>renderContentGroup(g, idx)).join("")}`;
}

function renderContentFactory(){
  const wrap = document.getElementById("contentListWrap");
  if(!wrap) return;
  const groups = buildContentGroups();
  contentGroupsMeta = groups;
  const conIdx = groups.map((g, idx)=>({g, idx}));
  const eventi_ = conIdx.filter(({g})=>g.collegamentoTipo !== "training");
  const training_ = conIdx.filter(({g})=>g.collegamentoTipo === "training");
  wrap.innerHTML = groups.length
    ? renderContentBucket("Eventi", eventi_) + renderContentBucket("Training", training_)
    : `<p style="color:var(--muted);font-size:13px;">Nessun contenuto ancora. Crea il primo con "+ Nuovo contenuto".</p>`;

  const tot = contentItems.length;
  const inRevisione = contentItems.filter(c=>c.stato==="In revisione").length;
  const pubblicati = contentItems.filter(c=>c.stato==="Pubblicato").length;
  document.getElementById("kpi-content").innerHTML = `
    <div class="kpi-card"><div class="kpi-label">Contenuti totali</div><div class="kpi-value">${tot}</div></div>
    <div class="kpi-card"><div class="kpi-label">In revisione</div><div class="kpi-value">${inRevisione}</div></div>
    <div class="kpi-card"><div class="kpi-label">Pubblicati</div><div class="kpi-value">${pubblicati}</div></div>
  `;
}

// ============================================================
// Materiale grezzo per evento/training + generazione di più bozze
// in un colpo solo a partire da quel materiale.
// ============================================================
const MATERIALE_STORAGE_KEY = "materialeGrezzoItems";
let materialeItems = {}; // chiave "tipo|nome|data" -> {collegamentoTipo, collegamentoNome, collegamentoData, materiale, updatedAt}

function materialeKey(tipo, nome, data){
  return `${tipo}|${nome}|${data||""}`;
}

function loadMaterialeFromLocal(){
  try{
    const raw = localStorage.getItem(MATERIALE_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveMaterialeToLocal(){
  try{ localStorage.setItem(MATERIALE_STORAGE_KEY, JSON.stringify(materialeItems)); }catch(e){}
}
async function saveMaterialeRemote(item){
  if(!WRITE_MATERIALE_URL) return;
  try{
    await fetch(WRITE_MATERIALE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(item)
    });
  }catch(e){
    console.error("Errore salvataggio Materiale Grezzo:", e);
  }
}

// Stesso motivo del normalizeContentRow: "Elenca righe" restituisce le
// intestazioni della tabella Excel (PascalCase), non i nomi camelCase.
function normalizeMaterialeRow(r){
  const collegamentoTipo = r["CollegamentoTipo"] ?? r.collegamentoTipo;
  const collegamentoNome = r["CollegamentoNome"] ?? r.collegamentoNome;
  const collegamentoData = r["CollegamentoData"] ?? r.collegamentoData ?? "";
  return {
    id: r["ID"] ?? r.id ?? materialeKey(collegamentoTipo, collegamentoNome, collegamentoData),
    collegamentoTipo, collegamentoNome, collegamentoData,
    materiale: r["Materiale"] ?? r.materiale ?? "",
    updatedAt: r["UltimoAggiornamento"] ?? r.updatedAt ?? "",
  };
}

async function loadMaterialeItems(){
  let list = [];
  if(READ_MATERIALE_URL){
    try{
      const res = await fetch(READ_MATERIALE_URL, { method: "POST" });
      const rows = await res.json();
      list = rows.map(normalizeMaterialeRow).filter(m=>m.collegamentoNome);
    }catch(e){
      console.error("Errore caricamento Materiale Grezzo, uso la copia locale:", e);
      list = Object.values(loadMaterialeFromLocal());
    }
  }else{
    list = Object.values(loadMaterialeFromLocal());
  }
  materialeItems = {};
  list.forEach(m=>{ materialeItems[materialeKey(m.collegamentoTipo, m.collegamentoNome, m.collegamentoData)] = m; });
}

function getMaterialeTesto(tipo, nome, data){
  const m = materialeItems[materialeKey(tipo, nome, data)];
  return m ? m.materiale : "";
}

// Angoli diversi usati a rotazione sulle bozze generate in batch, per
// evitare che N post dallo stesso materiale escano tutti identici.
const ANGOLI_BOZZE = [
  "il contesto e gli obiettivi dell'evento/training",
  "un momento saliente o un aneddoto specifico emerso dal materiale",
  "i risultati concreti ottenuti",
  "un invito a partecipare o a contattarci per saperne di più",
];

// Salva il materiale grezzo del gruppo idx (uno per evento/training +
// tipo contenuto — vedi buildContentGroups/contentGroupsMeta). Si salva
// da sola: sia mentre si scrive (con un piccolo ritardo, vedi
// scheduleAutosaveMateriale), sia al cambio focus, sia appena prima di
// generare/rigenerare una bozza — non serve nessun pulsante "Salva".
function salvaMaterialeGroup(idx){
  const g = contentGroupsMeta[idx];
  if(!g) return;
  const ta = document.getElementById(`materiale-${idx}`);
  if(!ta) return;
  const materiale = ta.value;
  const item = {
    id: materialeKey(g.collegamentoTipo, g.collegamentoNome, g.collegamentoData),
    collegamentoTipo: g.collegamentoTipo,
    collegamentoNome: g.collegamentoNome,
    collegamentoData: g.collegamentoData,
    materiale,
    updatedAt: new Date().toISOString(),
  };
  materialeItems[item.id] = item;
  saveMaterialeToLocal();
  saveMaterialeRemote(item);
  const statusEl = document.getElementById(`materialeStatus-${idx}`);
  if(statusEl) statusEl.textContent = "Salvato.";
}

// Autosalvataggio con un piccolo ritardo mentre si scrive, per non fare
// una scrittura di rete a ogni singolo carattere digitato.
const materialeAutosaveTimers = {};
function scheduleAutosaveMateriale(idx){
  const statusEl = document.getElementById(`materialeStatus-${idx}`);
  if(statusEl) statusEl.textContent = "Salvataggio...";
  clearTimeout(materialeAutosaveTimers[idx]);
  materialeAutosaveTimers[idx] = setTimeout(()=>salvaMaterialeGroup(idx), 800);
}

// Genera N bozze per il gruppo idx, usando il materiale grezzo corrente
// di quel gruppo (salvato appena prima, così riflette eventuali modifiche
// fatte alla textarea). Le bozze create finiscono in coda sotto lo stesso
// evento/training, con lo stesso tipo contenuto del gruppo.
async function generaBozzeGroup(idx){
  const g = contentGroupsMeta[idx];
  if(!g) return;
  const n = Math.max(0, Math.min(20, parseInt(document.getElementById(`numBozze-${idx}`).value, 10) || 0));
  const statusElInit = document.getElementById(`generaBozzeStatus-${idx}`);
  if(n === 0){
    if(statusElInit) statusElInit.innerHTML = `<span class="error">Imposta quante bozze generare (almeno 1).</span>`;
    return;
  }
  const materiale = document.getElementById(`materiale-${idx}`).value;
  salvaMaterialeGroup(idx);

  for(let i=0; i<n; i++){
    const statusEl = document.getElementById(`generaBozzeStatus-${idx}`);
    if(statusEl) statusEl.textContent = `Genero bozza ${i+1} di ${n}...`;
    // Data pianificata e responsabile si impostano dopo, per ogni bozza
    // singolarmente, direttamente sulla card in elenco.
    const item = {
      id: generateContentId(),
      collegamentoTipo: g.collegamentoTipo,
      collegamentoNome: g.collegamentoNome,
      collegamentoData: g.collegamentoData,
      tipoContenuto: g.tipoContenuto,
      stato: "Da scrivere",
      titolo: "",
      testo: "",
      dataPianificata: "",
      dataPubblicazione: "",
      linkPubblicato: "",
      responsabile: "",
      updatedAt: new Date().toISOString(),
    };
    contentItems.push(item);
    saveContentToLocal();
    saveContentRemote(item);

    if(GENERATE_CONTENT_URL){
      const angolo = ANGOLI_BOZZE[i % ANGOLI_BOZZE.length];
      try{
        const res = await fetch(GENERATE_CONTENT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tipoContenuto: g.tipoContenuto, collegamentoTipo: g.collegamentoTipo, collegamentoNome: g.collegamentoNome,
            collegamentoData: g.collegamentoData, materialeGrezzo: materiale, angolo,
          })
        });
        const data = await res.json();
        if(data && data.testo) updateContentItem(item.id, { titolo: data.titolo || "", testo: data.testo, stato: "Bozza" });
      }catch(e){
        console.error("Errore generazione bozza multipla:", e);
      }
    }
    // renderContentFactory() ricostruisce tutto contentListWrap (compreso
    // questo stesso pannello): per aggiornare lo stato di avanzamento va
    // ripreso l'elemento dal DOM ogni volta, un riferimento preso prima
    // del giro di loop punterebbe a un nodo ormai staccato dal documento.
    renderContentFactory();
  }
  const finalStatusEl = document.getElementById(`generaBozzeStatus-${idx}`);
  if(finalStatusEl) finalStatusEl.innerHTML = `<span style="color:var(--good);">${n} bozze create.</span>`;
}

const contentNavBtn = document.querySelector('.nav button[data-view="content"]');
if(contentNavBtn) contentNavBtn.addEventListener("click", refreshContentRiferimentoOptions);

loadAll();
loadTrainingFromMaster();
loadEmptyGroups();
loadContentItems();
loadMaterialeItems().then(refreshContentRiferimentoOptions);
</script>
</body>
</html>
